  <line x1="185" y1="1036" x2="485" y2="715" stroke="#000000" stroke-width="1.3"/>
  <line x1="185" y1="1043" x2="485" y2="780" stroke="#000000" stroke-width="1.3"/>
  <line x1="185" y1="1050" x2="485" y2="845" stroke="#000000" stroke-width="1.3"/>
  <line x1="185" y1="1057" x2="485" y2="940" stroke="#000000" stroke-width="1.3"/>
  <line x1="185" y1="1064" x2="485" y2="995" stroke="#000000" stroke-width="1.3"/>
  <line x1="185" y1="1071" x2="485" y2="1050" stroke="#000000" stroke-width="1.3"/>
