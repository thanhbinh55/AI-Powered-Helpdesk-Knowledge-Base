  <ellipse cx="660" cy="1210" rx="175" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="1215" text-anchor="middle" font-size="12.5" fill="#000000"><tspan font-weight="700">UC-15:</tspan> Kiểm duyệt chỉnh sửa và gửi gợi ý AI</text>

  <ellipse cx="660" cy="1270" rx="175" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="1275" text-anchor="middle" font-size="12.5" fill="#000000"><tspan font-weight="700">UC-18:</tspan> Xem lịch sử gợi ý AI</text>

  <ellipse cx="660" cy="1330" rx="175" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
