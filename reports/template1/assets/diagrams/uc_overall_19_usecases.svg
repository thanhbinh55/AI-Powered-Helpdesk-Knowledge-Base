    <circle cx="1155" cy="185" r="11"/>
    <line x1="1155" y1="196" x2="1155" y2="222"/>
    <line x1="1135" y1="206" x2="1175" y2="206"/>
    <line x1="1155" y1="222" x2="1139" y2="244"/>
