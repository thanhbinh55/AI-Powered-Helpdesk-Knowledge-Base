  <text x="660" y="155" text-anchor="middle" font-size="12.5" fill="#000000"><tspan font-weight="700">UC-01:</tspan> Đăng ký và đăng nhập hệ thống</text>

  <ellipse cx="660" cy="215" rx="175" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="220" text-anchor="middle" font-size="12.5" fill="#000000"><tspan font-weight="700">UC-16:</tspan> Đặt lại mật khẩu</text>

