  <rect x="385" y="465" width="550" height="415" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="400" y="484" font-size="12" font-weight="700" fill="#000000">Phân hệ Quản lý ticket</text>

