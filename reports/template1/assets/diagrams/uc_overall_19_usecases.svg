  <text x="660" y="80" text-anchor="middle" font-size="12.5" font-weight="400" fill="#222222">
    (Sơ đồ Use Case Tổng thể — 19 Use Cases)
  </text>

  <!-- Module Sub-boxes (dashed package boundaries inside system) -->
  <!-- Phân hệ Định danh và phân quyền -->
  <rect x="385" y="95" width="550" height="355" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="5,4"/>
