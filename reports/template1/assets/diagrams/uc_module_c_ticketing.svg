<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" width="1060" height="780" font-family="Arial, 'Segoe UI', Roboto, sans-serif">
  <rect width="1060" height="780" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect x="340" y="40" width="520" height="700" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">
    Module C — Quản lý Ticket
  </text>
  <text x="600" y="92" text-anchor="middle" font-size="12.5" font-weight="400" fill="#222222">
    (Ticket Management)
  </text>

  <!-- Associations: Customer -->
  <line x1="168" y1="165" x2="440" y2="145" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="172" x2="440" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="180" x2="440" y2="460" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="188" x2="440" y2="565" stroke="#000000" stroke-width="1.4"/>

  <!-- Associations: Support Agent -->
  <line x1="168" y1="390" x2="440" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="398" x2="440" y2="355" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="406" x2="440" y2="460" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="414" x2="440" y2="565" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="422" x2="440" y2="670" stroke="#000000" stroke-width="1.4"/>

  <!-- Associations: System Administrator -->
  <line x1="168" y1="605" x2="440" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="613" x2="440" y2="355" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="621" x2="440" y2="460" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="629" x2="440" y2="565" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="637" x2="440" y2="670" stroke="#000000" stroke-width="1.4"/>

  <!-- Use Cases (6 Ellipses) -->
  <ellipse cx="600" cy="145" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-05</text>
  <text x="600" y="159" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Tạo yêu cầu hỗ trợ</text>

  <ellipse cx="600" cy="250" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-06</text>
  <text x="600" y="264" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Xem danh sách và chi tiết ticket</text>

  <ellipse cx="600" cy="355" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-07</text>
  <text x="600" y="369" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Tiếp nhận và phân công ticket</text>

  <ellipse cx="600" cy="460" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-08</text>
  <text x="600" y="474" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Gửi tin nhắn công khai và ghi chú nội bộ</text>

  <ellipse cx="600" cy="565" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-09</text>
  <text x="600" y="579" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Chuyển trạng thái ticket</text>

  <ellipse cx="600" cy="670" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="665" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-10</text>
  <text x="600" y="684" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Xem lịch sử sự kiện ticket</text>

  <!-- Actors (UML Stickmen) -->
  <!-- Customer -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="143" r="12"/>
    <line x1="140" y1="155" x2="140" y2="185"/>
    <line x1="118" y1="165" x2="162" y2="165"/>
    <line x1="140" y1="185" x2="122" y2="209"/>
    <line x1="140" y1="185" x2="158" y2="209"/>
  </g>
  <text x="140" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Customer</text>
  <text x="140" y="246" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Khách hàng)</text>

  <!-- Support Agent -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="373" r="12"/>
    <line x1="140" y1="385" x2="140" y2="415"/>
    <line x1="118" y1="395" x2="162" y2="395"/>
    <line x1="140" y1="415" x2="122" y2="439"/>
    <line x1="140" y1="415" x2="158" y2="439"/>
  </g>
  <text x="140" y="459" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Support Agent</text>
  <text x="140" y="476" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Nhân viên hỗ trợ)</text>

  <!-- System Administrator -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="593" r="12"/>
    <line x1="140" y1="605" x2="140" y2="635"/>
    <line x1="118" y1="615" x2="162" y2="615"/>
    <line x1="140" y1="635" x2="122" y2="659"/>
    <line x1="140" y1="635" x2="158" y2="659"/>
  </g>
  <text x="140" y="679" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">System Administrator</text>
  <text x="140" y="696" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Quản trị viên hệ thống)</text>
</svg>

