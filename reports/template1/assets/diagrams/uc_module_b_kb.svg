<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="Arial, 'Segoe UI', Roboto, sans-serif">
  <rect width="1160" height="520" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect x="330" y="45" width="510" height="430" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="585" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">
    Module B — Cơ sở tri thức
  </text>
  <text x="585" y="98" text-anchor="middle" font-size="12.5" font-weight="400" fill="#222222">
    (Knowledge Base Management)
  </text>

  <!-- Associations -->
  <line x1="168" y1="165" x2="425" y2="160" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="175" x2="425" y2="275" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="185" x2="425" y2="390" stroke="#000000" stroke-width="1.4"/>

  <line x1="168" y1="380" x2="425" y2="390" stroke="#000000" stroke-width="1.4"/>

  <line x1="745" y1="160" x2="995" y2="265" stroke="#000000" stroke-width="1.4"/>
  <line x1="745" y1="390" x2="995" y2="280" stroke="#000000" stroke-width="1.4"/>

  <!-- Use Cases (3 Ellipses) -->
  <ellipse cx="585" cy="160" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="585" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-11</text>
  <text x="585" y="174" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Tải lên và xử lý tài liệu tri thức</text>

  <ellipse cx="585" cy="275" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="585" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-12</text>
  <text x="585" y="289" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Công bố và lưu trữ tài liệu tri thức</text>

  <ellipse cx="585" cy="390" rx="160" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="585" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-13</text>
  <text x="585" y="404" text-anchor="middle" font-size="13" font-weight="400" fill="#000000">Tìm kiếm tri thức</text>

  <!-- Actors (UML Stickmen) -->
  <!-- System Administrator -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="143" r="12"/>
    <line x1="140" y1="155" x2="140" y2="185"/>
    <line x1="118" y1="165" x2="162" y2="165"/>
    <line x1="140" y1="185" x2="122" y2="209"/>
    <line x1="140" y1="185" x2="158" y2="209"/>
  </g>
  <text x="140" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">System Administrator</text>
  <text x="140" y="246" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Quản trị viên hệ thống)</text>

  <!-- Support Agent -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="353" r="12"/>
    <line x1="140" y1="365" x2="140" y2="395"/>
    <line x1="118" y1="375" x2="162" y2="375"/>
    <line x1="140" y1="395" x2="122" y2="419"/>
    <line x1="140" y1="395" x2="158" y2="419"/>
  </g>
  <text x="140" y="439" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Support Agent</text>
  <text x="140" y="456" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Nhân viên hỗ trợ)</text>

  <!-- Embedding Provider -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1025" cy="243" r="12"/>
    <line x1="1025" y1="255" x2="1025" y2="285"/>
    <line x1="1003" y1="265" x2="1047" y2="265"/>
    <line x1="1025" y1="285" x2="1007" y2="309"/>
    <line x1="1025" y1="285" x2="1043" y2="309"/>
  </g>
  <text x="1025" y="328" text-anchor="middle" font-size="11.5" font-style="italic" fill="#000000">«system»</text>
  <text x="1025" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Embedding Provider</text>
</svg>

