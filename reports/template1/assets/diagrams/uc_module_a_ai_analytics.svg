<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Arial, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="680" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect x="330" y="40" width="540" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <text x="600" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">
    Phân hệ Trợ lý AI và Thống kê
  </text>
  <text x="600" y="92" text-anchor="middle" font-size="12.5" font-weight="400" fill="#222222">
    (AI Assistance &amp; Analytics Subsystem — 5 Use Cases)
  </text>

  <!-- Associations: Support Agent (x: 168, y: 190) -->
  <line x1="168" y1="190" x2="430" y2="140" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="198" x2="430" y2="245" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="206" x2="430" y2="350" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="214" x2="430" y2="455" stroke="#000000" stroke-width="1.4"/>

  <!-- Associations: System Administrator (x: 168, y: 460) -->
  <line x1="168" y1="450" x2="430" y2="140" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="458" x2="430" y2="245" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="466" x2="430" y2="350" stroke="#000000" stroke-width="1.4"/>
  <line x1="168" y1="474" x2="430" y2="560" stroke="#000000" stroke-width="1.4"/>

  <!-- Association: Embedding / LLM Provider (x: 1010, y: 155) -->
  <line x1="770" y1="140" x2="1010" y2="155" stroke="#000000" stroke-width="1.4"/>

  <!-- 5 Use Cases -->
  <!-- UC-14 -->
  <ellipse cx="600" cy="140" rx="170" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-14</text>
  <text x="600" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#000000">Tạo gợi ý trả lời tự động bằng AI</text>

  <!-- UC-15 -->
  <ellipse cx="600" cy="245" rx="170" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-15</text>
  <text x="600" y="259" text-anchor="middle" font-size="12.5" font-weight="400" fill="#000000">Kiểm duyệt chỉnh sửa và gửi gợi ý AI</text>

  <!-- UC-18 -->
  <ellipse cx="600" cy="350" rx="170" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-18</text>
  <text x="600" y="364" text-anchor="middle" font-size="12.5" font-weight="400" fill="#000000">Xem lịch sử gợi ý AI</text>

  <!-- UC-19 -->
  <ellipse cx="600" cy="455" rx="170" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-19 (P1)</text>
  <text x="600" y="469" text-anchor="middle" font-size="12.5" font-weight="400" fill="#000000">Đánh giá gợi ý AI hữu ích hoặc không hữu ích</text>

  <!-- UC-17 -->
  <ellipse cx="600" cy="560" rx="170" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="555" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">UC-17 (P1)</text>
  <text x="600" y="574" text-anchor="middle" font-size="12.5" font-weight="400" fill="#000000">Xem thống kê tổng quan ticket</text>

  <!-- Actors Left -->
  <!-- Support Agent -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="170" r="12"/>
    <line x1="140" y1="182" x2="140" y2="212"/>
    <line x1="118" y1="192" x2="162" y2="192"/>
    <line x1="140" y1="212" x2="122" y2="236"/>
    <line x1="140" y1="212" x2="158" y2="236"/>
  </g>
  <text x="140" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Support Agent</text>
  <text x="140" y="273" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Nhân viên được giao ticket)</text>

  <!-- System Administrator -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="430" r="12"/>
    <line x1="140" y1="442" x2="140" y2="472"/>
    <line x1="118" y1="452" x2="162" y2="452"/>
    <line x1="140" y1="472" x2="122" y2="496"/>
    <line x1="140" y1="472" x2="158" y2="496"/>
  </g>
  <text x="140" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">System Administrator</text>
  <text x="140" y="533" text-anchor="middle" font-size="11.5" font-weight="400" fill="#222222">(Quản trị viên hệ thống)</text>

  <!-- Secondary Actor Right: LLM Provider -->
  <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1045" cy="125" r="12"/>
    <line x1="1045" y1="137" x2="1045" y2="167"/>
    <line x1="1023" y1="147" x2="1067" y2="147"/>
    <line x1="1045" y1="167" x2="1027" y2="191"/>
    <line x1="1045" y1="167" x2="1063" y2="191"/>
  </g>
  <text x="1045" y="210" text-anchor="middle" font-size="11.5" font-style="italic" fill="#000000">«system»</text>
  <text x="1045" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Embedding / LLM Provider</text>
</svg>
