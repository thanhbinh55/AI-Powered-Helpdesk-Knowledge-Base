  <ellipse cx="640" cy="1242" rx="160" ry="21" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="640" y="1247" text-anchor="middle" font-size="12.5" fill="#000000"><tspan font-weight="700">UC-17:</tspan> Xem thống kê ticket</text>

