  <!-- Module Sub-boxes (dashed package boundaries inside system) -->
  <!-- Module D -->
  <rect x="375" y="95" width="530" height="355" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="390" y="114" font-size="12" font-weight="700" fill="#000000">Module D — Định danh và phân quyền</text>

  <!-- Module C -->
  <rect x="375" y="465" width="530" height="415" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="5,4"/>
