<text x="440" y="61" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Đăng ký, đăng nhập,</text>
<text x="440" y="81" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">đặt lại mật khẩu (P1)</text>
