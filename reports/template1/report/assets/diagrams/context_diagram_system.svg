<text x="440" y="651" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">quản trị tri thức, thống kê</text>
<polyline points="870,360 1030,231 1326,231" fill="none" stroke="#111" stroke-width="1.45" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1030" y="221" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Embedding và gợi ý AI</text>
