<text x="440" y="251" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tạo/xem ticket, trao đổi,</text>
<text x="440" y="271" text-anchor="middle" font-size="15" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">xác nhận đóng hoặc mở lại</text>
