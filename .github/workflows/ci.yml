name: Application CI

on: pull_request

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clarune_test
          POSTGRES_USER: clarune
          POSTGRES_PASSWORD: clarune_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U clarune -d clarune_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify pgvector is available
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U clarune -d clarune_test -At \
            -c "SELECT EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'vector')" \
            | grep -qx t

      - name: Run Maven verify
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/clarune_test
          DB_USERNAME: clarune
          DB_PASSWORD: clarune_ci
          JWT_SECRET: clarune-ci-only-signing-key-for-tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
