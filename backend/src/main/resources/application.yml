spring:
  application:
    name: helpdesk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Security & App configuration
app:
  jwt:
    secret: ${JWT_SECRET:default_dev_jwt_secret_must_be_over_256_bits_for_hmac_sha256}
    access-token-expiration-seconds: 900 # 15 minutes (FR-ID-05)
    refresh-token-expiration-seconds: 604800 # 7 days

